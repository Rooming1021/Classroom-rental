<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학교 반 대여 시스템</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="site-title" href="#" aria-label="학교 반 대여 시스템 홈">
          <span class="brand-dot" aria-hidden="true"></span>
          <span class="title-copy">
            <strong>학교 반 대여 시스템</strong>
            <span id="availableSummary">현재 예약 가능 교실 12개</span>
          </span>
        </a>

        <nav class="header-actions" aria-label="사용자 메뉴">
          <button class="nav-action" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 2v4M16 2v4M3.5 9.5h17M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" />
            </svg>
            <span>내 예약</span>
          </button>
          <button class="nav-action" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" />
            </svg>
            <span>알림</span>
          </button>
        </nav>
      </header>

      <main class="workspace">
        <section class="toolbar" aria-label="교실 검색 조건">
          <div class="floor-tabs" role="tablist" aria-label="층 선택">
            <button class="floor-tab" type="button" aria-disabled="true">1F</button>
            <button class="floor-tab is-active" type="button" data-floor="2F">2F</button>
            <button class="floor-tab" type="button" aria-disabled="true">3F</button>
            <button class="floor-tab" type="button" aria-disabled="true">4F</button>
          </div>

          <div class="filter-group">
            <div class="filter-select" aria-label="교실 유형 전체">
              <span class="filter-label">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
                </svg>
                교실
              </span>
              <span class="filter-divider" aria-hidden="true"></span>
              <span class="filter-value">전체</span>
              <svg class="select-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </div>

            <div class="filter-select" aria-label="예약 상태 전체">
              <span class="filter-label">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7h16M7 12h10M10 17h4" />
                </svg>
                상태
              </span>
              <span class="filter-divider" aria-hidden="true"></span>
              <span class="filter-value">전체</span>
              <svg class="select-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </div>
          </div>
        </section>

        <section class="content-layout" id="contentLayout">
          <div class="classroom-board" aria-label="교실 목록">
            <div class="classroom-grid" id="classroomGrid"></div>
            <div class="board-footer" aria-live="polite">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 17v-5M12 8h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              </svg>
              <span id="resultSummary">교실 카드를 클릭하면 예약 상세 페이지로 이동합니다.</span>
            </div>
          </div>

          <aside class="reservation-panel" id="detailDrawer" aria-label="예약 상세">
            <div class="panel-header">
              <button class="drawer-close" type="button" id="closeDrawer" aria-label="예약 상세에서 돌아가기">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m15 18-6-6 6-6" />
                </svg>
              </button>
              <div class="panel-title-row">
                <h2 id="drawerTitle">(2)수업나눔교실</h2>
                <span class="drawer-kicker" id="drawerStatus">예약 가능</span>
              </div>
            </div>

            <section class="panel-section" aria-label="날짜 선택">
              <h3>날짜 선택</h3>
              <div class="date-strip">
                <button class="date-arrow" type="button" aria-label="이전 날짜">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m15 18-6-6 6-6" />
                  </svg>
                </button>
                <button type="button">5.18<br />월</button>
                <button type="button">5.19<br />화</button>
                <button class="is-active" type="button">5.20<br />수</button>
                <button type="button">5.21<br />목</button>
                <button type="button">5.22<br />금</button>
                <button class="date-arrow" type="button" aria-label="다음 날짜">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m9 18 6-6-6-6" />
                  </svg>
                </button>
              </div>
            </section>

            <section class="panel-section" aria-label="시간 선택">
              <div class="section-row">
                <h3>시간 선택</h3>
                <div class="legend">
                  <span class="legend-item available">대여 가능</span>
                  <span class="legend-item unavailable">예약 불가</span>
                  <span class="legend-item disabled">사용 불가</span>
                </div>
              </div>
              <div class="time-grid">
                <button class="time reservable" type="button">8:00 - 9:00</button>
                <button class="time available" type="button">9:00 - 10:00</button>
                <button class="time available" type="button">10:00 - 11:00</button>
                <button class="time reservable" type="button">1:00 - 2:00</button>
                <button class="time unavailable" type="button">2:00 - 3:00</button>
                <button class="time unavailable" type="button">3:00 - 4:00</button>
                <button class="time disabled" type="button">4:00 - 5:00</button>
                <button class="time disabled" type="button">5:00 - 6:00</button>
              </div>
            </section>

            <section class="panel-section reserve-info" aria-label="예약 정보 입력">
              <h3>예약 정보 입력</h3>
              <label>
                <span>사용 목적</span>
                <input type="text" placeholder="사용 목적을 입력해주세요." />
              </label>
            </section>

            <button class="reserve-button" type="button" id="reserveButton">예약하기</button>
          </aside>
        </section>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
